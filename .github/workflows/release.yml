name: Release

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-package:
    name: Build Next.js and package theme
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Build Next.js
        run: |
          npm ci
          npm run build

      - name: Sync theme assets and create zip
        run: |
          chmod +x wordpress/cvc-theme/scripts/*.sh
          ./wordpress/cvc-theme/scripts/copy-theme-assets.sh
          ./wordpress/cvc-theme/scripts/package-theme.sh

      - name: Upload zip to GitHub Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: wordpress/cvc-theme.zip

      - name: Upload zip artifact (manual runs)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: cvc-theme
          path: wordpress/cvc-theme.zip
          retention-days: 30
